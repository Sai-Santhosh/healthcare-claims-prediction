# =============================================================================
# Medical Claims Data Engineering Platform - Configuration
# =============================================================================
# Production-grade ETL/ELT pipeline for healthcare claims data mesh architecture

project:
  name: "Medical Claims Data Engineering Platform"
  version: "2.0.0"
  description: "Enterprise ETL/ELT data pipeline with AWS cloud infrastructure"
  environment: "production"  # development, staging, production

# -----------------------------------------------------------------------------
# Data Source Configuration
# -----------------------------------------------------------------------------
data_sources:
  claims:
    source_type: "file"
    file_path: "data/raw/PUBLICUSE_CLAIM_MC_2016.txt"
    delimiter: "|"
    total_rows: 16982295
    encoding: "utf-8"
    
  reference_tables:
    source_type: "directory"
    path: "PUBLICUSE_REF_TABLES/"
    tables:
      - "REF_ICD_DIAG"
      - "REF_CPT"
      - "REF_POS"
      - "REF_PROVIDER"

# -----------------------------------------------------------------------------
# ETL Pipeline Configuration
# -----------------------------------------------------------------------------
etl:
  chunk_size: 100000
  sample_size: 1000000
  parallel_workers: 4
  retry_attempts: 3
  retry_delay_seconds: 30
  
  stages:
    extract:
      enabled: true
      validate_schema: true
      track_lineage: true
    
    transform:
      enabled: true
      apply_quality_checks: true
      standardize_columns: true
    
    load:
      enabled: true
      target: "data_warehouse"
      mode: "upsert"

# -----------------------------------------------------------------------------
# AWS Services Configuration
# -----------------------------------------------------------------------------
aws:
  region: "us-east-1"
  
  # S3 Data Lake (Medallion Architecture)
  s3:
    data_lake_bucket: "medical-claims-data-lake"
    raw_prefix: "raw/"           # Landing zone
    bronze_prefix: "bronze/"      # Raw ingested
    silver_prefix: "silver/"      # Cleaned & transformed
    gold_prefix: "gold/"          # Business-ready aggregates
    artifacts_prefix: "artifacts/"
    
  # RDS PostgreSQL Data Warehouse
  rds:
    engine: "postgresql"
    instance_class: "db.t3.medium"
    database_name: "claims_warehouse"
    port: 5432
    schema: "claims"
    
  # Lambda Functions
  lambda:
    etl_trigger:
      function_name: "claims-etl-trigger"
      runtime: "python3.10"
      timeout: 900
      memory_size: 1024
    
    data_quality:
      function_name: "claims-data-quality"
      runtime: "python3.10"
      timeout: 300
      memory_size: 512
    
    alerting:
      function_name: "claims-alerting"
      runtime: "python3.10"
      timeout: 60
      memory_size: 256
  
  # Glue ETL
  glue:
    database: "claims_catalog"
    crawler_name: "claims-data-crawler"
    etl_job_name: "claims-etl-job"
    dpu_capacity: 2
    
  # SNS Alerting
  sns:
    topic_name: "claims-pipeline-alerts"
    alert_endpoints:
      - "data-team@company.com"
    
  # CloudWatch Monitoring
  cloudwatch:
    log_group: "/claims-pipeline/logs"
    metrics_namespace: "ClaimsPipeline"
    retention_days: 30
    alarms:
      - name: "HighErrorRate"
        metric: "ErrorCount"
        threshold: 10
        period: 300
      - name: "LongRunningJob"
        metric: "JobDuration"
        threshold: 3600
        period: 60

# -----------------------------------------------------------------------------
# Data Quality Configuration
# -----------------------------------------------------------------------------
data_quality:
  enabled: true
  framework: "great_expectations"
  
  expectations:
    claims:
      - column: "CLAIM_ID_KEY"
        checks: ["not_null", "unique"]
      - column: "AMT_BILLED"
        checks: ["not_null", "non_negative"]
      - column: "AMT_PAID"
        checks: ["not_null", "non_negative"]
      - column: "AGE"
        checks: ["in_range"]
        params: {min: 0, max: 120}
    
  thresholds:
    critical: 0.99
    warning: 0.95
    
  actions:
    on_critical_failure: "halt_pipeline"
    on_warning: "send_alert"

# -----------------------------------------------------------------------------
# Data Modeling (Star Schema)
# -----------------------------------------------------------------------------
data_model:
  type: "star_schema"
  
  fact_tables:
    - name: "fact_claims"
      grain: "claim_line_item"
      measures:
        - "amt_billed"
        - "amt_paid"
        - "amt_deduct"
        - "amt_coins"
        - "qty"
      
  dimension_tables:
    - name: "dim_patient"
      attributes: ["patient_key", "age_band", "gender", "state", "county"]
      scd_type: 2
      
    - name: "dim_provider"
      attributes: ["provider_key", "provider_type", "specialty"]
      scd_type: 1
      
    - name: "dim_diagnosis"
      attributes: ["icd_code", "icd_category", "description"]
      scd_type: 1
      
    - name: "dim_procedure"
      attributes: ["cpt_code", "procedure_category", "description"]
      scd_type: 1
      
    - name: "dim_date"
      attributes: ["date_key", "year", "quarter", "month", "week", "day"]
      scd_type: 0

# -----------------------------------------------------------------------------
# DBT Configuration
# -----------------------------------------------------------------------------
dbt:
  project_name: "claims_transforms"
  profile: "claims_warehouse"
  target: "prod"
  
  models:
    staging:
      materialized: "view"
      schema: "staging"
    
    intermediate:
      materialized: "ephemeral"
      
    marts:
      materialized: "table"
      schema: "marts"

# -----------------------------------------------------------------------------
# Monitoring & Alerting
# -----------------------------------------------------------------------------
monitoring:
  metrics:
    - name: "rows_processed"
      type: "counter"
    - name: "processing_time_seconds"
      type: "histogram"
    - name: "data_quality_score"
      type: "gauge"
    - name: "error_count"
      type: "counter"

# -----------------------------------------------------------------------------
# CI/CD Configuration
# -----------------------------------------------------------------------------
cicd:
  provider: "github_actions"
  
  environments:
    development:
      auto_deploy: true
      run_tests: true
    staging:
      auto_deploy: true
      run_tests: true
    production:
      auto_deploy: false
      require_approval: true

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  data_dir: "data"
  raw_dir: "data/raw"
  bronze_dir: "data/bronze"
  silver_dir: "data/silver"
  gold_dir: "data/gold"
  models_dir: "models"
  logs_dir: "logs"
  reports_dir: "reports"
  dbt_dir: "dbt"

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
